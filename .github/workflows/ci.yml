name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install -r requirements.txt
      # Regenerates everything from the committed inputs (no network). Verification results are committed, not re-run.
      - run: python3 tools/build.py
      - run: python3 tools/make_schemas.py
      - run: python3 tools/validate.py
      - run: python3 tools/make_api.py
      - run: python3 tools/export_data.py
      - run: node tools/parity_check.js
      - run: node tools/sim_check.js
      - run: python3 tools/smoke_test.py
