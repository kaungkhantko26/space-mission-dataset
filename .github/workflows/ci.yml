name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      # Rebuilds everything from committed inputs (no network): staging build, strict verified dataset, API, exports.
      - run: python3 tools/build.py
      - run: python3 tools/make_schemas.py
      - run: python3 tools/validate.py            # staging checks
      - run: python3 tools/make_verified.py
      - run: python3 tools/validate_verified.py   # strict-mode checks (re-reads raw source files)
      - run: python3 tools/make_api.py
      - run: python3 tools/export_data.py
      - run: python3 tools/smoke_test.py
